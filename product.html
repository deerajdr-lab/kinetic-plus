<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetic Plus | Product Details</title>
    <style>
        /* General Styles (Matches index.html) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            color: #1a1a1a;
        }

        /* Navigation */
        nav {
            background-color: white;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eaeaea;
        }
        .logo-text { font-size: 24px; font-weight: 900; font-style: italic; letter-spacing: -1px; margin: 0; }
        .logo-text span { color: #0066cc; }
        .nav-links a { text-decoration: none; color: #333; margin-left: 25px; font-weight: 600; font-size: 15px; }
        .nav-links a:hover { color: #0066cc; }

        /* Product Container - Desktop Layout */
        .product-view-container {
            max-width: 1000px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            display: flex;
            gap: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .product-image-section {
            flex: 1;
        }
        .product-image-section img {
            width: 100%;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #eaeaea;
        }
        .product-info-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
        }
        .product-info-section h2 {
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 15px;
            color: #1a1a1a;
        }
        .product-price {
            color: #0066cc;
            font-size: 28px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .product-description {
            color: #555;
            line-height: 1.8;
            font-size: 16px;
            margin-bottom: 30px;
            flex-grow: 1;
        }
        .btn {
            background: #0066cc;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .btn:hover { background: #0052a3; }

        /* Footer */
        footer {
            background-color: #e6f0f9; padding: 40px 60px 20px 60px; font-size: 13px; color: #333; margin-top: 60px;
        }
        .footer-columns { display: flex; justify-content: space-between; margin-bottom: 30px; }
        .footer-col { flex: 1; margin-right: 20px; }
        .footer-bottom { border-top: 1px solid #ccc; padding-top: 20px; display: flex; justify-content: space-between; color: #666; }

        /* --- MOBILE RESPONSIVENESS (DEEP INTEGRATION) --- */
        @media (max-width: 768px) {
            /* Fix Navigation for Phones */
            nav {
                flex-direction: column;
                padding: 15px 20px;
                gap: 15px;
                text-align: center;
            }
            .nav-links {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }
            .nav-links a {
                margin: 0;
                font-size: 14px;
            }

            /* Fix Product Container for Phones */
            .product-view-container {
                flex-direction: column; /* Stacks image on top, text on bottom */
                margin: 20px 15px;
                padding: 20px;
                gap: 25px;
            }
            .product-info-section h2 {
                font-size: 24px;
            }
            .product-price {
                font-size: 22px;
            }
            .product-description {
                font-size: 15px;
            }

            /* Fix Footer for Phones */
            footer {
                padding: 30px 20px 15px 20px;
            }
            .footer-columns {
                flex-direction: column;
                gap: 25px;
            }
            .footer-bottom {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <div class="logo-container">
            <h2 class="logo-text">KINETIC<span>+</span></h2>
        </div>
        <div class="nav-links">
            <a href="index.html">Equipment</a>
            <a href="#">Clinics</a>
            <a href="#">About Us</a>
            <a href="contact.html">Contact</a>
            <a href="#">Malayalam</a>
        </div>
    </nav>

    <!-- Dynamic Product Container -->
    <div id="single-product-container" class="product-view-container">
        <!-- The text below shows briefly while the server fetches the image -->
        <h2 style="text-align: center; width: 100%; color: #0066cc;">Loading equipment details...</h2>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-columns">
            <div class="footer-col" style="flex: 2;">
                <h4>Kinetic Plus</h4>
                <p>Kinetic is Physiotherapy Equipment Supplier in Kerala, India.</p>
            </div>
            <div class="footer-col">
                <h4>Contact numbers</h4>
                <p>📞 +91 484 - 3717338</p>
            </div>
            <div class="footer-col">
                <h4>Email us</h4>
                <p>✉️ kinetic-pluss@gmail.com</p>
            </div>
        </div>
        <div class="footer-bottom">
            <div>© 2026 <a href="admin.html" style="color: inherit; text-decoration: none; cursor: default;">Kinetic Plus</a>: equipment suppliers.</div>
        </div>
    </footer>

    <!-- Script to Fetch the Correct Product from the Database -->
    <script>
        async function loadSpecificProduct() {
            // 1. Read the exact product ID from the web address
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            // If someone opens product.html directly without clicking a product first
            if (!productId) {
                document.getElementById('single-product-container').innerHTML = `
                    <div style="text-align: center; width: 100%;">
                        <h2>No product selected.</h2>
                        <a href="index.html" class="btn" style="display: inline-block; padding: 10px 20px;">Go Back to Equipment</a>
                    </div>`;
                return;
            }

            try {
                // 2. Ask your live Render server for this specific item (No localhost here!)
                const response = await fetch(`/api/get-equipment/${productId}`);
                const product = await response.json();

                // 3. Inject the real image, title, price, and description into the HTML
                document.getElementById('single-product-container').innerHTML = `
                    <div class="product-image-section">
                        <img src="${product.imageUrl}" alt="${product.name}">
                    </div>
                    <div class="product-info-section">
                        <h2>${product.name}</h2>
                        <h3 class="product-price">₹${product.price}/-</h3>
                        <p class="product-description">${product.description}</p>
                        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 25px;">
    <h4 style="margin-top: 0; margin-bottom: 10px;">Technical Specifications:</h4>
    <p style="margin: 0; white-space: pre-line; color: #444;">${product.specifications || 'No specifications provided.'}</p>
</div>

<a href="mailto:kinetic-pluss...
                        
                        <!-- Automatically fills the email subject line with the machine's name -->
                        <a href="mailto:kinetic-pluss@gmail.com?subject=Purchase Inquiry: ${product.name}" class="btn">Contact to Purchase</a>
                    </div>
                `;
            } catch (error) {
                console.error("Error loading product:", error);
                document.getElementById('single-product-container').innerHTML = '<h2 style="color: red; text-align: center; width: 100%;">Error loading product details. Please refresh the page.</h2>';
            }
        }

        // Run this function the moment the page loads
        window.onload = loadSpecificProduct;
    </script>

</body>
</html>
